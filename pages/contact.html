<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @media (max-width: 480px) {
  .contact-info-box {
    width: 85% !important;
    margin: 0 auto !important;
    padding: 15px 10px !important;
    font-size: 14px !important;
  }

  .contact-info-box p {
    font-size: 14px !important;
    line-height: 1.4;
    margin-bottom: 10px !important;
  }

  .contact-info-box p strong {
    font-weight: 600;
  }

  .social-icons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 5px;
    flex-wrap: nowrap;
  }

  .social-icons a i {
    font-size: 18px;
  }
}
</style>

</head>
<body>

  <div id="navbar-placeholder"></div>

  <!-- ✅ Contact Page Banner -->
  <section class="contact-banner page-banner">
    <div class="contact-banner-content">
      <h1>CONTACT US</h1>
      <p>We’d love to hear from you — get in touch anytime.</p>
    </div>
  </section>

  <!-- ✅ Contact Section -->
  <section style="background-color: #0f0f0f; color: #fff; padding: 100px 30px 60px; font-family: 'Segoe UI', sans-serif;">
    <div style="text-align: center; margin-bottom: 50px;">
      <h1 style="font-size: 48px; font-weight: 600; margin: 0; font-family: 'Orbitron', sans-serif;">Let's Talk</h1>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 30px; justify-content: space-between;">

      <!-- Contact Form -->
      <form action="mailto:info@theempireinsights.com" method="post" enctype="text/plain" style="flex: 1 1 55%; display: flex; flex-wrap: wrap; gap: 20px;">
        <input type="text" name="name" placeholder="Name" required style="background-color: transparent; border: none; border-bottom: 1px solid #aaa; color: #fff; padding: 10px; width: calc(50% - 10px); font-size: 16px;">
        <input type="email" name="email" placeholder="Email" required style="background-color: transparent; border: none; border-bottom: 1px solid #aaa; color: #fff; padding: 10px; width: calc(50% - 10px); font-size: 16px;">
        <input type="tel" name="phone" placeholder="Phone" style="background-color: transparent; border: none; border-bottom: 1px solid #aaa; color: #fff; padding: 10px; width: calc(50% - 10px); font-size: 16px;">
        <textarea name="message" placeholder="Message" required style="width: 100%; background-color: transparent; border: none; border-bottom: 1px solid #aaa; color: #fff; padding: 10px; font-size: 16px; height: 100px; resize: vertical;"></textarea>
        <button type="submit" style="background-color: #fff; color: #000000; padding: 12px 30px; font-weight: bold; text-transform: uppercase; border: none; margin-top: 20px; cursor: pointer;">Send Message</button>
      </form>

      <!-- ✅ Contact Info Box -->
      <div style="display: flex; justify-content: center; padding: 20px; flex: 1 1 35%;">
        <div class="contact-info-box" style="
          background-color: #fff;
          color: #000;
          padding: 30px 25px;
          border-radius: 10px;
          max-width: 400px;
          width: 100%;
          box-sizing: border-box;
        ">
          <p style="font-size: 18px; margin-bottom: 20px;">
            📧 <strong>Email us:</strong><br>
            <span style="font-size: 15px;">info@theempireinsights.com</span>
          </p>
          <p style="font-size: 18px; margin-bottom: 30px;">
            📍 <strong>Address:</strong><br>
            Pune
          </p>

          <p style="font-weight: bold; margin-bottom: 10px; font-size: 18px;">Follow us:</p>
         <div class="social-icons">
  <a href="https://x.com/The_45Empire?t=alzRMjF1ebX5L0gDwQSacA&s=09" aria-label="Twitter" target="_blank">
    <i class="fab fa-twitter" style="color: #1DA1F2;"></i>
  </a>
  <a href="https://www.linkedin.com/company/the-empire-insights/" aria-label="LinkedIn" target="_blank">
    <i class="fab fa-linkedin-in" style="color: #0077B5;"></i>
  </a>
  <a href="https://www.instagram.com/the_empire_insights?igsh=dm8wYzdoZng4M3Zr" aria-label="Instagram" target="_blank">
    <i class="fab fa-instagram" style="color: #E4405F;"></i>
  </a>
  <a href="https://www.facebook.com/the_empire_insights" aria-label="Facebook" target="_blank">
    <i class="fab fa-facebook-f" style="color: #1877F2;"></i>
  </a>
</div>

        </div>
      </div>

    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script defer src="../js/include-nav-footer.js"></script>
  <script defer src="../js/script.js"></script>

</body>
</html>
