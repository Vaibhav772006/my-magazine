<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Articles</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <section class="article-banner">
    <div class="article-banner-content">
      <h2>ARTICLES</h2>
      <p>Dive into thought-provoking articles authored by innovators, disruptors, and visionaries. Each article delivers in-depth insights into business, leadership, and impact.</p>
    </div>
  </section>

  <br><br>

  <div class="articles-grid" id="articles-container">
    <!-- Articles will load dynamically here -->
  </div>

  <br>
  <script src="../js/script.js"></script>
  <div id="footer-placeholder"></div>
  <script src="../js/include-nav-footer.js"></script>
  <script src="../js/load-articles.js"></script>

  <script>
    function toggleMenu() {
      const nav = document.querySelector('.navbar');
      nav.classList.toggle('show');
    }
  </script>
</body>
</html>
