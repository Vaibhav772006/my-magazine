<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-site-verification" content="HI4F3xJNEMNANtPi0ggxT1XeK7OUKcplKlHCj5J67Gg" />
  <title>Read Magazine Online | The Empire Insights</title>
  <meta name="description" content="Read the latest edition of The Empire Insights magazine online." />
  <link rel="canonical" href="https://yourdomain.com/magazine-view.html" />

  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="apple-touch-icon" href="images/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/magazine-view.css" />
</head>

<body class="magazine-reader-page">
  <a class="skip-link" href="#mag-view-main-layout">Skip to content</a>

  <header id="navbar-placeholder"></header>

  <nav class="mag-breadcrumb-nav" aria-label="Breadcrumb">
    <ol class="mag-breadcrumb-container">
      <li><a href="index.html"><i class="fas fa-home" aria-hidden="true"></i> Home</a></li>
      <li><a href="magazine.html">Magazines</a></li>
      <li><a id="mag-breadcrumb-preview" href="magazine-preview.html">Edition Preview</a></li>
      <li aria-current="page">Reader View</li>
    </ol>
  </nav>

  <main class="magazine-reader-shell" id="mag-view-main-layout">
    <div class="mag-reader-toolbar">
      <a id="mag-back-btn" class="mag-tool-btn" href="magazine.html">
        <i class="fas fa-arrow-left" aria-hidden="true"></i> All Editions
      </a>
      <button type="button" id="mag-share-view-btn" class="mag-tool-btn" aria-label="Share this edition">
        <i class="fas fa-share-alt" aria-hidden="true"></i> Share
      </button>
    </div>

    <article class="mag-reader-hero" itemscope itemtype="https://schema.org/PublicationIssue">
      <figure class="mag-view-figure">
        <a id="mag-cover-pdf-link" class="mag-cover-pdf-link" href="#" target="_blank" rel="noopener noreferrer"
           aria-label="Open magazine PDF">
          <img id="mag-view-cover" class="mag-view-cover" alt="Magazine cover"
               width="600" height="800" fetchpriority="high" itemprop="image" />
        </a>
      </figure>

      <div class="mag-reader-hero-content" aria-live="polite">
        <div class="mag-view-meta-top">
          <span id="mag-view-badge-issue" class="mag-badge-issue"></span>
          <span id="mag-view-category" class="mag-category-tag"></span>
          <time id="mag-view-date" class="mag-date" itemprop="datePublished"></time>
        </div>
        <h1 id="mag-view-title" class="mag-view-title" itemprop="name">Loading edition…</h1>
        <p id="mag-view-subtitle" class="mag-view-subtitle"></p>
        <p id="mag-view-description" class="mag-reader-hero-description" itemprop="description"></p>

        <div class="mag-reader-hero-actions">
          <a id="mag-view-pdf-btn" class="mag-btn-secondary" href="#" target="_blank"
             rel="noopener noreferrer" hidden>
            <i class="fas fa-book-open" aria-hidden="true"></i> View Digital Magazine
          </a>
        </div>
        <noscript><p>Please enable JavaScript to view this edition.</p></noscript>
      </div>
    </article>

    <section class="mag-reader-featured" id="mag-reader-featured" aria-labelledby="featured-heading" hidden>
      <div class="mag-reader-section-heading">
        <span class="section-kicker">Inside this issue</span>
        <h2 id="featured-heading">Featured Article</h2>
      </div>
      <a id="mag-reader-featured-card" class="mag-reader-featured-card" href="#">
        <img id="mag-reader-featured-image" alt="" width="400" height="260" loading="lazy" />
        <div>
          <span id="mag-reader-featured-category"></span>
          <h3 id="mag-reader-featured-title"></h3>
          <p id="mag-reader-featured-excerpt"></p>
          <strong>Read article <i class="fas fa-arrow-right" aria-hidden="true"></i></strong>
        </div>
      </a>
    </section>

    <section class="mag-reader-articles" id="mag-reader-articles" aria-labelledby="related-heading" hidden>
      <div class="mag-reader-section-heading">
        <span class="section-kicker">Continue reading</span>
        <h2 id="related-heading">Related Articles</h2>
      </div>
      <ul class="mag-reader-articles-grid" id="mag-reader-articles-list"></ul>
    </section>
  </main>

  <footer id="footer-placeholder"></footer>

  <script defer src="js/include-nav-footer.js"></script>
  <script defer src="js/script.js"></script>
  <script defer src="js/seo-helper.js"></script>
  <script defer src="js/magazine-view.js"></script>
</body>
</html>
