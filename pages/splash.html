<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Empire Insight</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { height: 100%; overflow: hidden; }
    .splash {
      position: fixed;
      width: 100%;
      height: 100vh;
      background: #0D0D0D;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
      color: #fff;
      text-align: center;
    }
    .splash-logo {
      width: 200px;
      height: auto;
      margin-bottom: 24px;
      animation: logoLanding 1.5s ease-out forwards;
    }
    @keyframes logoLanding {
      0% { transform: translateY(-40px) scale(0.85); opacity: 0; }
      70% { transform: translateY(6px) scale(1.03); opacity: 1; }
      100% { transform: translateY(0) scale(1); }
    }
    .splash-tagline {
      font-family: Georgia, serif;
      font-size: 1.1rem;
      color: #B5892A;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: fadeUp 1s 0.8s ease-out both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 600px) {
      .splash-logo { width: 120px; }
      .splash-tagline { font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <div class="splash" id="splashScreen">
    <img src="../images/logo.png" alt="The Empire Insight Logo" class="splash-logo">
    <p class="splash-tagline">From Insight to Impact</p>
  </div>
  <script>
    setTimeout(function() {
      window.location.href = 'index.html';
    }, 2500);
  </script>
</body>
</html>
