<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navbar with Search on Top</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    /* Top bar */
    .top-bar {
      background-color: #c28c67;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 30px;
      flex-wrap: wrap;
    }

    .top-search {
      display: flex;
      gap: 8px;
      flex: 1;
      align-items: center;
    }

    .top-search input {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      width: 100%;
      max-width: 300px;
    }

    .top-search button {
      background-color: black;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .top-search button i {
      font-size: 14px;
    }

    .social-icons {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .social-icons a {
      color: black;
      font-size: 16px;
      transition: color 0.3s ease;
    }

    .social-icons a:hover {
      color: white;
    }

    /* Main navbar */
    .main-header {
      background-color: #000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 30px;
      flex-wrap: wrap;
    }

    .logo img {
      height: 50px;
    }

    .main-nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      padding: 0;
      margin: 0;
    }

    .main-nav ul li a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      padding: 6px 10px;
      border-bottom: 2px solid transparent;
      transition: 0.3s;
    }

    .main-nav ul li a:hover,
    .main-nav ul li a.active {
      color: #f1a45d;
      border-bottom: 2px solid #f1a45d;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .top-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 20px;
      }

      .main-header {
        flex-direction: column;
        gap: 10px;
        padding: 10px 20px;
      }

      .main-nav ul {
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      .social-icons {
        justify-content: center;
        width: 100%;
        margin-top: 8px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-search">
      <input type="text" placeholder="Search..." />
      <button><i class="fas fa-search"></i></button>
    </div>
    <div class="social-icons">
      <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
      <a href="#" aria-label="Twitter"><i class="fab fa-x-twitter"></i></a>
      <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
    </div>
  </div>

  <!-- Main Navigation -->
  <header class="main-header">
    <div class="logo">
      <img src="your-logo-path.png" alt="Logo" />
    </div>

    <nav class="main-nav">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About Us</a></li>
        <li><a href="#">Magazines</a></li>
        <li><a href="#">Hall of Fame</a></li>
        <li><a href="#">Articles</a></li>
        <li><a href="#">Blogs</a></li>
        <li><a href="#">Contact Us</a></li>
      </ul>
    </nav>
  </header>

</body>
</html>
